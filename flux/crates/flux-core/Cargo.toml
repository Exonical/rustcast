[package]
name = "flux-core"
description = "Core types, errors, configuration, and platform abstractions for Flux remote streaming"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
bitflags = { workspace = true }
byteorder = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# Relay machine registration/heartbeat loop (reqwest + tokio).
registration = ["dep:reqwest", "dep:tokio", "dep:serde_json"]

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.tokio]
workspace = true
optional = true
features = ["rt", "sync", "time"]

[dependencies.serde_json]
workspace = true
optional = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
windows = { workspace = true }
