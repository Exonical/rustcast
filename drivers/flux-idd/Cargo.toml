# Flux virtual display driver (UMDF 2 / IddCx) in Rust.
#
# This is a standalone workspace: it must be built on Windows with the eWDK or
# an installed WDK + cargo-make (see README.md), so it is intentionally not a
# member of the main flux workspace.
[package]
name = "flux-idd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Flux virtual display: a Rust Indirect Display Driver (IddCx/UMDF) for headless GPU-backed monitors"
publish = false

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
# 2.31 is the newest UMDF whose headers parse under clang/bindgen; the 2.33
# headers redeclare enums with mismatched fixed underlying types, which clang
# rejects even in -fms-compatibility mode.
target-umdf-version-minor = 31

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.5"
bindgen = "0.71"

[dependencies]
wdk = "0.4.1"
wdk-sys = "0.5"
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
] }

[profile.release]
panic = "abort"
lto = true

[profile.dev]
panic = "abort"
