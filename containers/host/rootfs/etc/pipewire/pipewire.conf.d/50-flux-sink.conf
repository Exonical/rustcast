# Dedicated null sink for Flux remote audio. Being the only sink, WirePlumber
# makes it the default; its monitor source is what flux-server captures.
context.objects = [
    { factory = adapter
        args = {
            factory.name           = support.null-audio-sink
            node.name              = "flux-sink"
            node.description       = "Flux Remote Audio"
            media.class            = Audio/Sink
            audio.position         = [ FL FR ]
            audio.rate             = 48000
            monitor.channel-volumes = true
        }
    }
]
