# podman kube play containers/flux-pod.yaml
# Both containers share the pod's network namespace, so the host registers with
# the relay over 127.0.0.1. Only the relay's ports are published.
# The host's DRI render nodes (renderD128 = dGPU, renderD129 = iGPU) are passed
# through to the host container for VA-API hardware encoding.
apiVersion: v1
kind: Pod
metadata:
  name: flux
  labels:
    app: flux
spec:
  containers:
    - name: relay
      image: localhost/flux-relay:latest
      imagePullPolicy: Never
      env:
        # Host browsers use the published WebTransport UDP port at this address.
        - name: FLUX_WT_PUBLIC_HOST
          value: "127.0.0.1"
        # OIDC login (Authentik runs in this pod; values injected by run.sh).
        - name: FLUX_OIDC_ISSUER
          value: "http://localhost:9000/application/o/flux/"
        - name: FLUX_OIDC_CLIENT_ID
          value: "flux-relay"
        - name: FLUX_OIDC_CLIENT_SECRET
          value: "%%FLUX_OIDC_CLIENT_SECRET%%"
        - name: FLUX_SESSION_SECRET
          value: "%%FLUX_SESSION_SECRET%%"
        - name: FLUX_RELAY_TOKEN
          value: "%%FLUX_RELAY_TOKEN%%"
        - name: FLUX_DATA_DIR
          value: "/var/lib/flux-relay"
      volumeMounts:
        - name: relay-data
          mountPath: /var/lib/flux-relay
      ports:
        - containerPort: 8080
          hostPort: 8080
          protocol: TCP
        - containerPort: 9101
          hostPort: 9101
          protocol: TCP
        - containerPort: 8443
          hostPort: 8443
          protocol: TCP
        - containerPort: 8443
          hostPort: 8443
          protocol: UDP
        - containerPort: 8445
          hostPort: 8445
          protocol: UDP
    - name: host
      image: localhost/flux-host:latest
      imagePullPolicy: Never
      command: ["/sbin/init"]
      env:
        - name: FLUX_DISPLAY_SIZE
          value: "1920x1080"
        - name: FLUX_RELAY_URL
          value: "http://127.0.0.1:8080"
        - name: FLUX_ADVERTISE_HOST
          value: "127.0.0.1"
        - name: FLUX_RELAY_TOKEN
          value: "%%FLUX_RELAY_TOKEN%%"
        - name: FLUX_WT_ADDR
          value: ":8445"
        - name: FLUX_DIRECT_STATUS_FILE
          value: "/run/flux/direct.json"
        - name: FLUX_DEVUSER_PASSWORD
          value: "%%FLUX_DEVUSER_PASSWORD%%"
        - name: FLUX_AK_ENROLLMENT_TOKEN
          value: "%%FLUX_AK_ENROLLMENT_TOKEN%%"
        - name: FLUX_LDAP_BIND_PASSWORD
          value: "%%FLUX_LDAP_BIND_PASSWORD%%"
        - name: RUST_LOG
          value: "info"
      volumeMounts:
        - name: dri-render-dgpu
          mountPath: /dev/dri/renderD128
        - name: dri-render-igpu
          mountPath: /dev/dri/renderD129
        - name: flux-home
          mountPath: /home
        - name: flux-machine-id
          mountPath: /var/lib/flux
    - name: authentik-postgres
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: "authentik"
        - name: POSTGRES_DB
          value: "authentik"
        - name: POSTGRES_PASSWORD
          value: "%%PG_PASS%%"
      volumeMounts:
        - name: authentik-postgres
          mountPath: /var/lib/postgresql/data
    - name: authentik-server
      image: ghcr.io/goauthentik/server:2026.8.4
      args: ["server"]
      env:
        - name: AUTHENTIK_SECRET_KEY
          value: "%%AUTHENTIK_SECRET_KEY%%"
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "127.0.0.1"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          value: "%%PG_PASS%%"
        - name: AUTHENTIK_LISTEN__HTTP
          value: "0.0.0.0:9000"
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          value: "%%AUTHENTIK_BOOTSTRAP_PASSWORD%%"
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          value: "%%AUTHENTIK_BOOTSTRAP_TOKEN%%"
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          value: "akadmin@localhost"
        # Consumed by the flux blueprint via !Env.
        - name: FLUX_OIDC_CLIENT_SECRET
          value: "%%FLUX_OIDC_CLIENT_SECRET%%"
        - name: FLUX_AK_ENROLLMENT_TOKEN
          value: "%%FLUX_AK_ENROLLMENT_TOKEN%%"
      ports:
        - containerPort: 9000
          hostPort: 9000
          protocol: TCP
      volumeMounts:
        - name: authentik-media
          mountPath: /media
        - name: authentik-blueprints
          mountPath: /blueprints/custom
          readOnly: true
    - name: authentik-worker
      image: ghcr.io/goauthentik/server:2026.8.4
      args: ["worker"]
      env:
        - name: AUTHENTIK_SECRET_KEY
          value: "%%AUTHENTIK_SECRET_KEY%%"
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "127.0.0.1"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          value: "%%PG_PASS%%"
        # The 2026.8 worker binary also opens HTTP/HTTPS/metrics listeners;
        # the pod shares one network namespace, so keep them off the server's
        # 9000/9443/9300 or the server crash-loops on "address already in use".
        - name: AUTHENTIK_LISTEN__HTTP
          value: "127.0.0.1:9001"
        - name: AUTHENTIK_LISTEN__HTTPS
          value: "127.0.0.1:9444"
        - name: AUTHENTIK_LISTEN__METRICS
          value: "127.0.0.1:9301"
        - name: FLUX_AK_ENROLLMENT_TOKEN
          value: "%%FLUX_AK_ENROLLMENT_TOKEN%%"
        - name: FLUX_OIDC_CLIENT_SECRET
          value: "%%FLUX_OIDC_CLIENT_SECRET%%"
        - name: FLUX_LDAP_OUTPOST_TOKEN
          value: "%%FLUX_LDAP_OUTPOST_TOKEN%%"
        - name: FLUX_LDAP_BIND_PASSWORD
          value: "%%FLUX_LDAP_BIND_PASSWORD%%"
      volumeMounts:
        - name: authentik-media
          mountPath: /media
        - name: authentik-blueprints
          mountPath: /blueprints/custom
          readOnly: true
    - name: authentik-ldap
      image: ghcr.io/goauthentik/ldap:2026.8.4
      env:
        - name: AUTHENTIK_HOST
          value: "http://localhost:9000"
        - name: AUTHENTIK_INSECURE
          value: "true"
        - name: AUTHENTIK_TOKEN
          value: "%%FLUX_LDAP_OUTPOST_TOKEN%%"
        # Outposts default their metrics listener to :9300 too.
        - name: AUTHENTIK_LISTEN__METRICS
          value: "127.0.0.1:9302"
  volumes:
    - name: dri-render-dgpu
      hostPath:
        path: /dev/dri/renderD128
        type: CharDevice
    - name: dri-render-igpu
      hostPath:
        path: /dev/dri/renderD129
        type: CharDevice
    - name: authentik-postgres
      persistentVolumeClaim:
        claimName: flux-authentik-postgres
    - name: authentik-media
      persistentVolumeClaim:
        claimName: flux-authentik-media
    - name: relay-data
      persistentVolumeClaim:
        claimName: flux-relay-data
    - name: flux-home
      persistentVolumeClaim:
        claimName: flux-home
    - name: flux-machine-id
      persistentVolumeClaim:
        claimName: flux-machine-id
    - name: authentik-blueprints
      hostPath:
        path: "%%BLUEPRINT_DIR%%"
        type: Directory
