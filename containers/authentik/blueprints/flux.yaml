# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: flux
entries:
  # "groups" scope so the relay can map group membership (flux-admins) to admin.
  - model: authentik_providers_oauth2.scopemapping
    id: flux-scope-groups
    identifiers:
      name: flux-groups
    attrs:
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}
  - model: authentik_providers_oauth2.oauth2provider
    id: flux-provider
    identifiers:
      name: flux-relay
    attrs:
      client_type: confidential
      client_id: flux-relay
      client_secret: !Env FLUX_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:8080/auth/callback"
        - matching_mode: strict
          url: "https://localhost:8443/auth/callback"
        # Any other host (e.g. a WSL2 VM IP) on the flux ports.
        - matching_mode: regex
          url: "^https?://[^/]+:(8080|8443)/auth/callback$"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf flux-scope-groups
  - model: authentik_core.application
    id: flux-app
    identifiers:
      slug: flux
    attrs:
      name: Flux
      provider: !KeyOf flux-provider
  - model: authentik_core.group
    id: flux-admins
    identifiers:
      name: flux-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]
  # Device-domain connector for pam/nss-authentik logins on the host.
  - model: authentik_endpoints_connectors_agent.agentconnector
    id: flux-agent-connector
    identifiers:
      name: flux-agent
    attrs: {}
  # Enrollment token consumed by flux-ak-join (ak-sysd domains join). The key
  # comes from .env.authentik so pod re-plays can re-enroll.
  - model: authentik_endpoints_connectors_agent.enrollmenttoken
    id: flux-enrollment-token
    identifiers:
      name: flux-enrollment
    attrs:
      connector: !KeyOf flux-agent-connector
      key: !Env FLUX_AK_ENROLLMENT_TOKEN
      expiring: false
