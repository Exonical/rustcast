# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: flux
entries:
  # "groups" scope so the relay can map group membership (flux-admins) to admin.
  - model: authentik_providers_oauth2.scopemapping
    id: flux-scope-groups
    identifiers:
      name: flux-groups
    attrs:
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}
  - model: authentik_providers_oauth2.oauth2provider
    id: flux-provider
    identifiers:
      name: flux-relay
    attrs:
      client_type: confidential
      client_id: flux-relay
      client_secret: !Env FLUX_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:8080/auth/callback"
        - matching_mode: strict
          url: "https://localhost:8443/auth/callback"
        # Any other host (e.g. a WSL2 VM IP) on the flux ports.
        - matching_mode: regex
          url: "^https?://[^/]+:(8080|8443)/auth/callback$"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf flux-scope-groups
  - model: authentik_core.application
    id: flux-app
    identifiers:
      slug: flux
    attrs:
      name: Flux
      provider: !KeyOf flux-provider
  - model: authentik_core.group
    id: flux-admins
    identifiers:
      name: flux-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]
  # Device-domain connector for pam/nss-authentik logins on the host.
  - model: authentik_endpoints_connectors_agent.agentconnector
    id: flux-agent-connector
    identifiers:
      name: flux-agent
    attrs: {}
  # Enrollment token consumed by flux-ak-join (ak-sysd domains join). The key
  # comes from .env.authentik so pod re-plays can re-enroll.
  - model: authentik_endpoints_connectors_agent.enrollmenttoken
    id: flux-enrollment-token
    identifiers:
      name: flux-enrollment
    attrs:
      connector: !KeyOf flux-agent-connector
      key: !Env FLUX_AK_ENROLLMENT_TOKEN
      expiring: false

  # LDAP outpost so hosts can log users in through SSSD (community-friendly
  # alternative to the Enterprise-only pam_authentik interactive auth).
  - model: authentik_core.user
    id: flux-ldap-svc
    identifiers:
      username: ldapservice
    attrs:
      name: Flux LDAP service account
      type: service_account
      password: !Env FLUX_LDAP_BIND_PASSWORD
      path: flux
  - model: authentik_providers_ldap.ldapprovider
    id: flux-ldap-provider
    identifiers:
      name: flux-ldap
    attrs:
      base_dn: "dc=ldap,dc=goauthentik,dc=io"
      bind_mode: cached
      search_mode: cached
      uid_start_number: 2000
      gid_start_number: 4000
      authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    # 2026.8 replaced search_group with this object permission.
    permissions:
      - permission: authentik_providers_ldap.search_full_directory
        user: !KeyOf flux-ldap-svc
  - model: authentik_core.application
    id: flux-ldap-app
    identifiers:
      slug: flux-ldap
    attrs:
      name: Flux LDAP
      provider: !KeyOf flux-ldap-provider
  - model: authentik_outposts.outpost
    id: flux-ldap-outpost
    identifiers:
      name: flux-ldap
    attrs:
      type: ldap
      providers:
        - !KeyOf flux-ldap-provider
      config:
        authentik_host: "http://localhost:9000"
  # The outpost's auto-created token (identifier ak-outpost-<uuid>-api) can't
  # be addressed by a blueprint — its key is pinned to FLUX_LDAP_OUTPOST_TOKEN
  # by containers/ak-ldap-bootstrap.sh after the first apply.
